name: ci
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, calendar
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Lint PHP (syntax)
        run: |
          mapfile -d '' files < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          if [ ${#files[@]} -gt 0 ]; then
            printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l
          else
            echo "No PHP sources yet — scaffold lint is a no-op."
          fi
      - name: Coding standards (PSR-12)
        run: composer run-script lint
      - name: Static analysis (PHPStan)
        run: composer run-script analyse
      - name: Unit tests (PHPUnit)
        run: composer run-script test
      # The full suite above already includes the validation harness across every PHP
      # version; the dedicated `validate` job below runs it as an explicit, named gate.

  # Per-target validation gate (#45 / #51 / #73 / #87): re-prove each rubric system, and
  # each particular-calendar overlay, against its own pinned oracles on every PR, as a
  # MATRIX so a regression in one target fails only its leg and can never mask another
  # (fail-fast is off). `1962` runs Computus vs easter_days() and the missalemeum fixture;
  # `1954`/`1955` run their Divinum Officium agreement fixtures; `overlays` runs the four
  # particular-calendar conformance gates — SSPX (vs its live ordo feed), FSSP/ICKSP (vs
  # pinned proper-day fixtures), and Generic 1962 (the identity-overlay proof). Each leg is
  # an explicit, named check (`validate (<name>)`) that can be required to merge. The
  # fixtures are committed (no network at test time) and each leg runs only its PHPUnit
  # group, so only the Composer dependencies are cached to keep every leg fast.
  validate:
    name: validate (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: '1962', group: 'edition-1962' }
          - { name: '1954', group: 'edition-1954' }
          - { name: '1955', group: 'edition-1955' }
          - { name: 'overlays', group: 'overlays' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, calendar
          coverage: none
          tools: composer:v2
      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Oracle gate — ${{ matrix.name }}
        run: composer run-script validate-oracles -- --group ${{ matrix.group }}

  # Build-time corpus generator (Node only; the runtime engine never runs it).
  # Asserts the committed corpus is reproducible and matches a fresh build.
  corpus-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install generator dependencies
        run: npm ci
        working-directory: tools/generator
      - name: Generator unit tests
        run: npm test
        working-directory: tools/generator
      - name: Verify corpus is reproducible and the committed copy is fresh
        run: npm run verify
        working-directory: tools/generator
