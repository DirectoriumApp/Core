name: ci
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, calendar
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Lint PHP (syntax)
        run: |
          mapfile -d '' files < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          if [ ${#files[@]} -gt 0 ]; then
            printf '%s\0' "${files[@]}" | xargs -0 -n1 -P4 php -l
          else
            echo "No PHP sources yet — scaffold lint is a no-op."
          fi
      - name: Coding standards (PSR-12)
        run: composer run-script lint
      - name: Static analysis (PHPStan)
        run: composer run-script analyse
      - name: Unit tests (PHPUnit)
        run: composer run-script test
      # NOTE: the validate-*.php / corpus-build steps are added by the later
      # engine issues, once the generator and validation harness exist.

  # Build-time corpus generator (Node only; the runtime engine never runs it).
  # Asserts the committed corpus is reproducible and matches a fresh build.
  corpus-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install generator dependencies
        run: npm ci
        working-directory: tools/generator
      - name: Verify corpus is reproducible and the committed copy is fresh
        run: npm run verify
        working-directory: tools/generator
