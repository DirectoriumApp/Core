name: Bug report
description: Report a defect in Core
labels: ["type: fix", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Environment
      description: Version(s), PHP version, and (for Ordo) WordPress + browser
