# The corpus source registry — the authoritative list of works every `cite`/`cites`
# marker foreign-keys into. Generated to data/corpus/sources.ndjson.
#
#   kind: text      — a transcribable work; a Latin title may be taken from it.
#         reference — consult-only; cited for uncopyrightable facts, never transcribed.
#         oracle    — validation input only (issue #45).
#   rights: public-domain — a title may be transcribed from it.
#           reference     — consult-only.
#           oracle        — validation only.
#
# The provenance gate enforces the clean-room rule: a transcribed name (names.*,
# nameOverride.*) must cite a `text` source whose rights are `public-domain`. Facts
# (rank, colour, month, day) may cite any registered source. One exception (option A,
# #108): a generic name-DESCRIPTOR — a temporal day-label, or a sanctoral saint's proper
# name plus a grade word / reform-coined feast title — may cite a `reference` source (the
# norming document that establishes it), never an oracle: it is an uncopyrightable
# identifier, not the copyrighted books' literary text. See text-licensing-model.md.

- key: mr-1920
  urn: directorium:source:mr-1920
  kind: text
  title: "Missale Romanum, editio typica"
  publisher: "Typis Polyglottis Vaticanis"
  year: 1920
  rights: public-domain
  note: "Public domain by age. The source for transcribed Latin titles in this set."

- key: rg-1960
  urn: directorium:source:rg-1960
  kind: reference
  title: "Rubricae Generales / Codex Rubricarum (1960)"
  year: 1960
  rights: reference
  note: "Consult-only. Cited for uncopyrightable facts (rank, colour, date); never transcribed."

- key: sspx-ordo
  urn: directorium:source:sspx-ordo
  kind: reference
  title: "Society of St Pius X — Ordo (Rubricae 1960 / 1962), District of the USA"
  year: 2024
  rights: reference
  note: "Consult-only. The authority for the SSPX particular-calendar overlay's rank
    facts (uncopyrightable). A witness to the 1962 calendar, never transcribed. Also
    pinned as a validation oracle — see tests/Validation/fixtures/sspx."

- key: fssp-ordo
  urn: directorium:source:fssp-ordo
  kind: reference
  title: "Priestly Fraternity of St Peter — proper calendar (Rubricae 1960 / 1962)"
  year: 2024
  rights: reference
  note: "Consult-only. The authority for the FSSP particular-calendar overlay's rank facts
    (uncopyrightable). The Fraternity's own published calendar: its District of England & Wales
    (fssp.org.uk) states the Chair of St Peter (22 Feb) is a feast of the FIRST class in FSSP
    apostolates — the Fraternity's titular patron, elevated from the universal second class. A
    witness to the FSSP proper calendar, never transcribed; a NON-EXHAUSTIVE subset of the
    Fraternity's promulgated Proprium (see the overlay's scope note)."

- key: icksp-ordo
  urn: directorium:source:icksp-ordo
  kind: reference
  title: "Institute of Christ the King Sovereign Priest — proper calendar (Rubricae 1960 / 1962)"
  year: 2024
  rights: reference
  note: "Consult-only. The authority for the ICKSP particular-calendar overlay's rank facts
    (uncopyrightable). The Institute's own published liturgical calendar (icksp.org.uk) names its
    patrons — St Francis de Sales (Principal Patron), St Thomas Aquinas and St Benedict (Patrons of
    the Institute), St Thérèse of Lisieux (Patroness of the Missions) — and its apostolate ordos
    print each at the FIRST class, elevated from the universal third class. A witness to the ICKSP
    proper calendar, never transcribed; a NON-EXHAUSTIVE subset of the Institute's promulgated
    Proprium (see the overlay's scope note)."

- key: ordo-1954
  urn: directorium:source:ordo-1954
  kind: reference
  title: "St. Lawrence Press — Ordo Recitandi (pre-1955 rite / Divino Afflatu)"
  year: 1954
  rights: reference
  note: "Consult-only. The authority for the 1954 (Divino Afflatu) edition's legacy grade
    (duplex/semiduplex/simplex), octave, and vigil facts (uncopyrightable). The native
    annual Ordo of the pre-1955 rubrics, still printed with a day-by-day companion. Pinned
    as the 1954 validation oracle — see docs/design/rubric-system-model.md."

- key: rg-da
  urn: directorium:source:rg-da
  kind: reference
  title: "Rubricae Generales Missalis et Breviarii Romani (Divino Afflatu, pre-1955)"
  year: 1920
  rights: reference
  note: "Consult-only. The general rubrics of the pre-1955 (Divino Afflatu) rite — the Tabellae
    Occurrentiae/Concurrentiae of the Missal and Titt. IV-VII of the Breviary — cited for the
    uncopyrightable precedence facts (the occurrence tier order, transfer, Sunday classes, and
    commemoration rules) of the roman-divino-afflatu edition. Public domain by age; the dated
    outcomes it governs are cross-checked against ordo-1954."

- key: cn-1955
  urn: directorium:source:cn-1955
  kind: reference
  title: "Cum nostra hac aetate — General Decree of the S.R.C. reducing the rubrics (23 March 1955)"
  year: 1955
  rights: reference
  note: "Consult-only. The decree of the Sacred Congregation of Rites (in force 1 Jan 1956) that
    governs the roman-rubricae-1955 edition: it suppressed the semidouble grade (Title II.1-2,
    II.20 — semidoubles kept as simples), reduced simples to a commemoration (II.21), retained
    only the Easter/Christmas/Pentecost octaves (II.11) and seven vigils (II.8-9), and set the
    0/1/2 commemoration caps (Title III.4). Cited for the uncopyrightable 1955 grade, suppression,
    and precedence facts, all derived from the 1954 data by this rule."

- key: do-1955
  urn: directorium:source:do-1955
  kind: oracle
  title: "Divinum Officium — 'Reduced - 1955' rubric set"
  year: 2024
  rights: oracle
  note: "Validation only. The Divinum Officium project's independent Perl implementation of the
    1955 (Cum nostra hac aetate) rubrics, run headless as a day-by-day witness to the resolved
    1955 office — the independent oracle for the roman-rubricae-1955 edition (issue #71), never
    a data source and never transcribed. Cf. ordo-1954 for the 1954 edition."

- key: cic-1917
  urn: directorium:source:cic-1917
  kind: reference
  title: "Codex Iuris Canonici (1917) — the law of fast and abstinence (cann. 1250–1254)"
  year: 1917
  rights: reference
  note: "Consult-only. The 1917 Code of Canon Law governs the traditional penitential discipline
    in force across the 1954/1955/1962 editions (until Paenitemini, 1966). Cann. 1250–1254 fix the
    days of fast, abstinence, and partial abstinence: abstinence on all Fridays (c.1252 §1); fast
    and abstinence on Ash Wednesday, the Fridays and Saturdays of Lent, the Ember days, and the
    vigils of Christmas, Pentecost, the Assumption, and All Saints (c.1252 §2); fast alone on the
    other weekdays of Lent (c.1252 §3). Cited for the uncopyrightable discipline facts the
    roman:cic-1917 penitential rules encode; the canons' text is never transcribed."

# ---- Novus Ordo (Ordinary Form) sources — Core v1.1 (#108) -------------------
# The reform's norming documents. The full running texts of the modern books are
# copyrighted (LEV/ICEL, see docs/design/text-licensing-model.md) and are NEVER
# transcribed; these are consult-only `reference` sources cited for the
# uncopyrightable calendar FACTS (rank, colour, season, day-structure) and — under
# Core option A — for the reform's generic Latin temporal day-LABELS ("Dominica per
# annum"), which are uncopyrightable descriptors, not literary titles.

- key: nu-1969
  urn: directorium:source:nu-1969
  kind: reference
  title: "Normae universales de Anno liturgico et de Calendario (1969)"
  year: 1969
  rights: reference
  note: "Consult-only. The General Norms for the Liturgical Year and the Calendar, promulgated
    with the motu proprio Mysterii Paschalis (14 Feb 1969) and printed at the head of the reformed
    Missale Romanum and the Calendarium Romanum. The norming authority for the roman-novus-ordo-2002
    edition's temporal STRUCTURE and precedence: the five seasons and the two-block 34-week Ordinary
    Time (nn. 43–44), the Sunday/solemnity/feast/memorial grades (nn. 10–16), and the Table of
    Liturgical Days (n. 59). Cited for those uncopyrightable facts and — per option A
    (text-licensing-model.md) — for the generic Latin day-labels of the temporal cycle it
    establishes (e.g. 'Dominica … per annum'); its running text is never transcribed."

- key: cal-rom-1969
  urn: directorium:source:cal-rom-1969
  kind: reference
  title: "Calendarium Romanum (ex decreto Sacrosancti Oecumenici Concilii Vaticani II instauratum)"
  publisher: "Typis Polyglottis Vaticanis"
  year: 1969
  rights: reference
  note: "Consult-only. The General Roman Calendar promulgated with the motu proprio Mysterii
    Paschalis (14 Feb 1969) and carried, updated, into the 2002 editio typica tertia of the Missale
    Romanum. The norming authority for the roman-novus-ordo-2002 edition's SANCTORAL calendar FACTS
    — which saint on which day, the grade (solemnity / feast / obligatory or optional memorial), and
    the colour — all uncopyrightable. Its running texts are copyrighted (LEV) and are never
    transcribed; a Latin saint-title is taken only from a public-domain text (mr-1920 /
    mart-rom-1922), never from here. The dated outcomes are cross-checked against the code oracles
    (romcal / LitCal / calapi) and a human ordo in the validation slice (#260)."

- key: mart-rom-1922
  urn: directorium:source:mart-rom-1922
  kind: text
  title: "Martyrologium Romanum, editio typica"
  publisher: "Typis Polyglottis Vaticanis"
  year: 1922
  rights: public-domain
  note: "Public domain by age. The Roman Martyrology's day-by-day roster of the saints, the source
    for a transcribed Latin saint-title in the Novus-Ordo sanctoral when the saint is NOT already in
    the shared identity union (a reform-restored ancient saint) and the title is not in the 1920
    Missal. A saint the reform keeps from the 1962 calendar is referenced by id and inherits its
    public-domain name from the base pass, so it needs no citation here."

- key: cic-1983
  urn: directorium:source:cic-1983
  kind: reference
  title: "Codex Iuris Canonici (1983) — the law of fast and abstinence (cann. 1249-1253); Paenitemini (1966)"
  year: 1983
  rights: reference
  note: "Consult-only. The 1983 Code of Canon Law (with Paul VI's Apostolic Constitution
    Paenitemini, 17 Feb 1966) governs the reformed penitential discipline the Novus-Ordo editions
    resolve under (roman:cic-1983). Cann. 1250-1252 keep the fast on Ash Wednesday and Good Friday
    only, and abstinence on those days and every Friday of the year outside a solemnity (c.1251),
    conferences free to substitute another penance outside Lent (c.1253). Cited for the
    uncopyrightable discipline facts; the canons' text is never transcribed."

- key: cdw-2016-magdalene
  urn: directorium:source:cdw-2016-magdalene
  kind: reference
  title: "Decree Apostolorum Apostola on the celebration of St Mary Magdalene in the General Roman Calendar"
  publisher: "Congregatio de Cultu Divino et Disciplina Sacramentorum"
  year: 2016
  rights: reference
  note: "Consult-only. The decree of the Congregation for Divine Worship (Prot. N. 257/16, 3 June
    2016) raising the memorial of St Mary Magdalene (22 July) to a FEAST in the General Roman
    Calendar — the dated decree over the 2002 snapshot the engine replays from 2016 (#366). Cited
    as the norming authority for the grade change (an uncopyrightable fact); its text is never
    transcribed."

- key: cdw-2018-mater-ecclesiae
  urn: directorium:source:cdw-2018-mater-ecclesiae
  kind: reference
  title: "Decree Ecclesia Mater on the celebration of the Blessed Virgin Mary, Mother of the Church"
  publisher: "Congregatio de Cultu Divino et Disciplina Sacramentorum"
  year: 2018
  rights: reference
  note: "Consult-only. The decree of the Congregation for Divine Worship (11 February 2018)
    inscribing the obligatory memorial of the Blessed Virgin Mary, Mother of the Church, in
    the General Roman Calendar on the Monday after Pentecost — the dated movable decree over the
    2002 snapshot the engine replays from 2018 (#366). Cited as the norming authority for the
    memorial and its reform-coined Latin title (an uncopyrightable descriptor, option A), never
    transcribing the decree's text."
