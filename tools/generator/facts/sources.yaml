# The corpus source registry — the authoritative list of works every `cite`/`cites`
# marker foreign-keys into. Generated to data/corpus/sources.ndjson.
#
#   kind: text      — a transcribable work; a Latin title may be taken from it.
#         reference — consult-only; cited for uncopyrightable facts, never transcribed.
#         oracle    — validation input only (issue #45).
#   rights: public-domain — a title may be transcribed from it.
#           reference     — consult-only.
#           oracle        — validation only.
#
# The provenance gate enforces the clean-room rule: a transcribed name (names.*,
# nameOverride.*) must cite a `text` source whose rights are `public-domain`. Facts
# (rank, colour, month, day) may cite any registered source.

- key: mr-1920
  urn: directorium:source:mr-1920
  kind: text
  title: "Missale Romanum, editio typica"
  publisher: "Typis Polyglottis Vaticanis"
  year: 1920
  rights: public-domain
  note: "Public domain by age. The source for transcribed Latin titles in this set."

- key: rg-1960
  urn: directorium:source:rg-1960
  kind: reference
  title: "Rubricae Generales / Codex Rubricarum (1960)"
  year: 1960
  rights: reference
  note: "Consult-only. Cited for uncopyrightable facts (rank, colour, date); never transcribed."

- key: sspx-ordo
  urn: directorium:source:sspx-ordo
  kind: reference
  title: "Society of St Pius X — Ordo (Rubricae 1960 / 1962), District of the USA"
  year: 2024
  rights: reference
  note: "Consult-only. The authority for the SSPX particular-calendar overlay's rank
    facts (uncopyrightable). A witness to the 1962 calendar, never transcribed. Also
    pinned as a validation oracle — see tests/Validation/fixtures/sspx."

- key: ordo-1954
  urn: directorium:source:ordo-1954
  kind: reference
  title: "St. Lawrence Press — Ordo Recitandi (pre-1955 rite / Divino Afflatu)"
  year: 1954
  rights: reference
  note: "Consult-only. The authority for the 1954 (Divino Afflatu) edition's legacy grade
    (duplex/semiduplex/simplex), octave, and vigil facts (uncopyrightable). The native
    annual Ordo of the pre-1955 rubrics, still printed with a day-by-day companion. Pinned
    as the 1954 validation oracle — see docs/design/rubric-system-model.md."

- key: rg-da
  urn: directorium:source:rg-da
  kind: reference
  title: "Rubricae Generales Missalis et Breviarii Romani (Divino Afflatu, pre-1955)"
  year: 1920
  rights: reference
  note: "Consult-only. The general rubrics of the pre-1955 (Divino Afflatu) rite — the Tabellae
    Occurrentiae/Concurrentiae of the Missal and Titt. IV-VII of the Breviary — cited for the
    uncopyrightable precedence facts (the occurrence tier order, transfer, Sunday classes, and
    commemoration rules) of the roman-divino-afflatu edition. Public domain by age; the dated
    outcomes it governs are cross-checked against ordo-1954."

- key: cn-1955
  urn: directorium:source:cn-1955
  kind: reference
  title: "Cum nostra hac aetate — General Decree of the S.R.C. reducing the rubrics (23 March 1955)"
  year: 1955
  rights: reference
  note: "Consult-only. The decree of the Sacred Congregation of Rites (in force 1 Jan 1956) that
    governs the roman-rubricae-1955 edition: it suppressed the semidouble grade (Title II.1-2,
    II.20 — semidoubles kept as simples), reduced simples to a commemoration (II.21), retained
    only the Easter/Christmas/Pentecost octaves (II.11) and seven vigils (II.8-9), and set the
    0/1/2 commemoration caps (Title III.4). Cited for the uncopyrightable 1955 grade, suppression,
    and precedence facts, all derived from the 1954 data by this rule."

- key: do-1955
  urn: directorium:source:do-1955
  kind: oracle
  title: "Divinum Officium — 'Reduced - 1955' rubric set"
  year: 2024
  rights: oracle
  note: "Validation only. The Divinum Officium project's independent Perl implementation of the
    1955 (Cum nostra hac aetate) rubrics, run headless as a day-by-day witness to the resolved
    1955 office — the independent oracle for the roman-rubricae-1955 edition (issue #71), never
    a data source and never transcribed. Cf. ordo-1954 for the 1954 edition."

- key: cic-1917
  urn: directorium:source:cic-1917
  kind: reference
  title: "Codex Iuris Canonici (1917) — the law of fast and abstinence (cann. 1250–1254)"
  year: 1917
  rights: reference
  note: "Consult-only. The 1917 Code of Canon Law governs the traditional penitential discipline
    in force across the 1954/1955/1962 editions (until Paenitemini, 1966). Cann. 1250–1254 fix the
    days of fast, abstinence, and partial abstinence: abstinence on all Fridays (c.1252 §1); fast
    and abstinence on Ash Wednesday, the Fridays and Saturdays of Lent, the Ember days, and the
    vigils of Christmas, Pentecost, the Assumption, and All Saints (c.1252 §2); fast alone on the
    other weekdays of Lent (c.1252 §3). Cited for the uncopyrightable discipline facts the
    roman:cic-1917 penitential rules encode; the canons' text is never transcribed."
