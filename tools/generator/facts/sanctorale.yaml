# Cited 1962 sanctoral facts.
#
# Each entry states its edition-invariant identity (id, kind, titulars, names) once
# and its per-edition realization under the edition key (rank, colour, month, day).
# Every datum is cited: `cites` maps a field to a source key. This is the clean-room
# boundary — a human asserts a fact and its source, never a scrape.
#
# Source keys used here:
#   mr-1920  — Missale Romanum (1920, public domain) — for the Latin titles.
#   rg-1960  — Rubricarum generalium (the 1960 New Rubrics) — for rank/colour/date.
#
# Names are Latin-first (`la`), the invariant fallback the engine requires;
# vernacular locales are added progressively in later work, each still cited.
# Ranks: 1 = class I (highest) … 4 = the commemoration tier. Vigils are violet
# under the 1960 rubrics and carry `vigilOf` linking to their feast.
#
# This set reproduces, byte for byte in resolved output, the entries the retired
# SeedSanctoralData carried, so the corpus swap (#41) is a provable no-op before
# the calendar is expanded. See docs/design/sanctoral-overlay-model.md.

- id: roman:sanctorale:cathedra-petri
  kind: feast
  titulars: [petrus]
  names:
    la: "Cathedra S. Petri Apostoli"
  cites:
    names.la: mr-1920
  roman-rubricae-1960:
    rank: 2
    colour: white
    month: 2
    day: 22
    cites: { rank: rg-1960, colour: rg-1960, month: rg-1960, day: rg-1960 }

