# Corpus build metadata. corpusVersion is an explicit fact, never the wall clock,
# so the build is reproducible: datestamp + serial (bump the serial on a re-cut of
# the same day). No edition token here — the editions are named below and keyed into
# the output tree.
corpusVersion: "1962-2026-07-11.1"

# `edition` is the BASE edition (the fullest, best-sourced dataset the others are
# authored as diffs from). It is built exactly as before — its output is byte-stable.
edition: roman-rubricae-1960

# Additional editions materialised as diffs from a `base` edition (Core v0.3.0). Each
# authors only the sanctoral entries that differ — a `roman-divino-afflatu` block on an
# entry states that edition's legacy grade and any changed colour/date. Entries with no
# block for an edition are simply absent from it. The base pass is untouched, so adding
# an edition can never move the base (1962) corpus.
editions:
  - dir: roman-divino-afflatu   # 1954 (Divino Afflatu)
    base: roman-rubricae-1960
  # 1955 (interim / Cum nostra hac aetate): a DERIVED edition — not authored block-by-block
  # but computed from the 1954 data by the reform's mechanical transform (deriveCumNostra1955:
  # semidouble→simple, simple→commemoration, doubles unchanged; nine vigils + all sanctoral
  # octaves suppressed). `derive` names the transform; `base` records what it is a diff of.
  - dir: roman-rubricae-1955    # 1955 (Cum nostra hac aetate)
    base: roman-divino-afflatu
    derive: cum-nostra-1955
  # Novus Ordo — editio typica tertia 2002/2008 (Core v1.1, #108). A WHOLE peer edition, NOT a
  # diff of 1962: it has its own sanctoral, ranks (novusRank), dates, and temporal skeleton, so
  # `whole: true` tells the build to take this edition's temporal archetypes ENTIRE from its own
  # facts/editions/roman-novus-ordo-2002/temporale.yaml rather than unioning them onto the base
  # 1962 archetypes (the additive-octave model the 1954 diff uses). It still shares the
  # cross-edition identity UNION — a saint kept from the traditional calendar is referenced by the
  # same id — preserving alignment-by-id for the v2.0 comparison tool. `base` names the edition it
  # shares the union with; there is no derive. The edition stays isBuilt=false in the engine until
  # #260 validates it, so it is built into the corpus but refused at the public boundary.
  - dir: roman-novus-ordo-2002  # Novus Ordo (Ordinary Form), 2002/2008 typical edition
    base: roman-rubricae-1960
    whole: true

generator: "@directorium/corpus-generator"
