# Cited temporal skeleton — the edition-invariant structural facts the Paschal
# computation consumes: the signed day-offset of every Easter-anchored point, and
# the season each coarse temporal block belongs to. Date ARITHMETIC stays in PHP
# (the fillers count days from Gregorian Easter); only these facts are data.
#
# Every row is cited. The offsets and block-season assignments are structural
# facts of the 1962 temporal cycle, cited to the 1960 rubrics (rg-1960).
#
#   easterOffsets: slot -> signed days from Easter Sunday (0). The Major Rogation
#     (25 Apr) is a fixed civil date, not Easter-relative, so it is not here.
#   blockSeasons:  coarse block -> the season it belongs to (several blocks may
#     share one season: Passion Week and Holy Week are both Passiontide).

easterOffsets:
  - { slot: septuagesima, offset: -63, cite: rg-1960 }
  - { slot: sexagesima, offset: -56, cite: rg-1960 }
  - { slot: quinquagesima, offset: -49, cite: rg-1960 }
  - { slot: ash-wednesday, offset: -46, cite: rg-1960 }
  - { slot: lent-1, offset: -42, cite: rg-1960 }
  - { slot: lent-ember-wednesday, offset: -39, cite: rg-1960 }
