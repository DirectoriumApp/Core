# Cited precedence rules of the 1954 (Divino Afflatu) edition — the pre-1955 order of
# occurrence, as data. Companion to the base edition's tools/generator/facts/precedence.yaml
# (1962). Fanned out by the generator into editions/roman-divino-afflatu/precedence-tiers.ndjson
# and precedence-rules.ndjson, and read at runtime by Rubrics1954Precedence (#67).
#
# WHY A SEPARATE FILE, NOT A DIFF. The pre-1955 system is not a re-ranking of the 1962
# Table of Liturgical Days: it is the older Tabella Occurrentiae, a wholly different order
# built on the live six-rung grade ladder (Duplex I classis > Duplex II classis > Duplex
# maius > Duplex > Semiduplex > Simplex — the Semiduplex grade the 1955 reform abolished).
# So it is authored whole, not as a diff.
#
# PROVENANCE. The tier order, the Sunday classes, the transfer set, and the commemoration
# model are the calendar-level facts of the Divino-Afflatu-era Rubricae Generales (rg-da:
# the Tabellae Occurrentiae/Concurrentiae of the Missal and Titt. IV-VII of the Breviary),
# adversarially verified against the primary text and cross-checked, date by date, against
# the St. Lawrence Press pre-1955 Ordo Recitandi (ordo-1954). See docs/design/rubric-system-model.md
# (Seam 6) for the research trail and the CONFIRMED-vs-DEFERRED boundary.
#
# THE TIER ORDER (lower ordinal wins occurrence). `line` mirrors `ordinal` — unlike 1962's
# n.91 there is no numbered pre-1955 table, so no independent line number exists. The four
# privileged TEMPORAL octaves are now minted for 1954 (#453): the 2nd-order octave day + days
# within (Epiphany, Corpus Christi) sit just below the Double I class, so they yield ONLY to a
# Double of the I class (which is exactly what stops a transferred lesser feast from landing on
# a Corpus-octave day — the Maria-Regina-1956 case); the 3rd-order days within (Ascension,
# Sacred Heart) sit beside the Christmas octave within, and the 3rd-order octave day is a plain
# greater double. Sundays sit high, per the Divino Afflatu elevation: a
# lesser (per-annum) Sunday yields ONLY to a Double of the I/II class and to a feast of the
# Lord, and outranks every ordinary double, semidouble, simple, octave, vigil, and feria
# below it (Rubr. Gen. Brev. Tit. IV, dated-proven by ordo-1954: the green Sunday keeps the
# day and the double is commemorated).
tiers:
  # --- Above the whole calendar: the Triduum and the three greatest feasts. ---
  - { selector: triduum, line: 1, ordinal: 1, subOrder: 0, cite: rg-da }
  - { selector: greatest, line: 2, ordinal: 2, subOrder: 0, cite: rg-da }
  # --- First-class greater Sundays: yield to nothing below the greatest feasts (Tit. IV §1;
  #     ordo-1954 "Palm Sunday ... no feast can take its place"). Above even a Double I class,
  #     which is only commemorated. ---
  - { selector: first-class-sunday, line: 3, ordinal: 3, subOrder: 0, cite: rg-da }
  - { selector: privileged-vigil, line: 4, ordinal: 4, subOrder: 0, cite: rg-da }
  - { selector: paschal-octave, line: 5, ordinal: 5, subOrder: 0, cite: rg-da }
  - { selector: privileged-feria, line: 6, ordinal: 6, subOrder: 0, cite: rg-da }
  # --- The I class, in dignity order on ONE line (broken by subOrder): a feast OF THE LORD
  #     (great-lord — Epiphany, the Circumcision, Ascension, Trinity, Corpus Christi, the Sacred
  #     Heart, Christ the King) outranks a I-class feast of a SAINT, so when the two occur the
  #     Lord's feast is celebrated and the saint transferred — as 1962 does, and as the pre-1955
  #     Tabella Occurrentiae ranks the I class by dignity (Lord > BVM > saint). This is what keeps
  #     Corpus Christi / the Sacred Heart on their own day when a I-class saint falls with them
  #     (St John the Baptist on 24 Jun / the Precious Blood on 1 Jul, in the rare years Easter is
  #     25/24 Apr), so their temporal octaves stay attached. Then the privileged 2nd-order
  #     temporal octaves, which yield ONLY to a Double I class (rubric-system-model.md §444;
  #     #453): the octave DAY (a Duplex maius of the Lord — Epiphany/Corpus Christi) above its
  #     days WITHIN (a semidouble). Both sit ABOVE All Souls / the II-class Sunday / the Double
  #     II class, so a transferred lesser feast (a Double II) can never land on a 2nd-order
  #     octave day. ---
  - { selector: great-lord, line: 7, ordinal: 7, subOrder: 0, cite: rg-da }
  - { selector: double-i-class, line: 7, ordinal: 7, subOrder: 1, cite: rg-da }
  - { selector: second-order-octave-day, line: 8, ordinal: 8, subOrder: 0, cite: ordo-1954 }
  - { selector: second-order-octave-within, line: 9, ordinal: 9, subOrder: 0, cite: ordo-1954 }
  - { selector: all-souls, line: 10, ordinal: 10, subOrder: 0, cite: rg-da }
  - { selector: second-class-sunday, line: 11, ordinal: 11, subOrder: 0, cite: rg-da }
  - { selector: double-ii-class, line: 12, ordinal: 12, subOrder: 0, cite: rg-da }
  # --- A feast OF THE LORD below Double II (an ordinary or greater double of the Lord)
  #     takes a lesser Sunday's place (Tit. IV §2). It sits ABOVE the lesser Sunday but
  #     below the II-class Sunday, which yields only to a Double I class. ---
  - { selector: feast-of-the-lord, line: 13, ordinal: 13, subOrder: 0, cite: rg-da }
  - { selector: lesser-sunday, line: 14, ordinal: 14, subOrder: 0, cite: rg-da }
  # --- Below the lesser Sunday: the ordinary festal grades and the octaves. A 3rd-order
  #     octave DAY (Ascension/Sacred Heart) is a plain greater double, so it routes to the
  #     greater-double tier in code. A 3rd-order octave WITHIN sits beside the Christmas octave
  #     within: any feast above a simple is celebrated within it, the octave commemorated. ---
  - { selector: greater-double, line: 15, ordinal: 15, subOrder: 0, cite: rg-da }
  - { selector: double, line: 16, ordinal: 16, subOrder: 0, cite: rg-da }
  - { selector: semidouble, line: 17, ordinal: 17, subOrder: 0, cite: rg-da }
  - { selector: christmas-octave-within, line: 18, ordinal: 18, subOrder: 0, cite: rg-da }
  - { selector: third-order-octave-within, line: 19, ordinal: 19, subOrder: 0, cite: ordo-1954 }
  # A day within a COMMON octave (the moveable Solemnity of St Joseph, Easter+18..+23, #453): a
  # semidouble that yields to any feast above a simple (the feast celebrated, the octave commemorated)
  # and wins over a simple. It sits just below the privileged 3rd-order octave within because a common
  # octave is weaker: a day within it is OMITTED (not commemorated) under a Double of the I or II class
  # (Sts Philip & James on 1 May; the Finding of the Cross on 3 May) — that omission is decided in
  # occurrenceOutcome/isOctaveOmitted, keyed by identity, since the temporal common octave carries no
  # legacy grade. Its octave DAY (Easter+24) is a greater double and routes to the greater-double tier.
  - { selector: common-octave-within, line: 20, ordinal: 20, subOrder: 0, cite: ordo-1954 }
  - { selector: greater-feria, line: 21, ordinal: 21, subOrder: 0, cite: rg-da }
  - { selector: common-vigil, line: 22, ordinal: 22, subOrder: 0, cite: rg-da }
  # The votive Office of Our Lady on a free Saturday (#453) sits ABOVE the Simple: on a free
  # Saturday it is the Office of the day and a coincident Simple is COMMEMORATED (the votive
  # "of the day" beats the real simple saint — Rubr. Gen., De Officio S. Mariae in Sabbato). It
  # still yields to every Semidouble-or-higher and to a privileged feria / vigil / Ember day (a
  # common vigil above it), and a displaced lady office is DROPPED, not commemorated
  # (decideOccurrence). Minted by SaturdayOfOurLady, so it carries no legacy grade and is routed
  # by kind (before the grade ladder) in Rubrics1954Precedence.
  - { selector: lady-on-saturday, line: 23, ordinal: 23, subOrder: 0, cite: rg-da }
  # A Simple of higher dignity (the two-simples tie-break, #453): among two Simples on one day
  # the more worthy by the general Table of Precedence is celebrated, the other commemorated
  # (Rubr. Gen., De occurrentia — "quod dignius est, celebratur; alterum commemoratur"). It
  # shares the Simple's line (24) but a lower subOrder, so it sorts first — the arbitrary
  # id-string tie-break never decides between two named Simples. The `dignior-simple` membership
  # set (below) names the dignified feasts; an unlisted Simple keeps subOrder 1.
  #   * 19 Jan — Ss Marius, Martha, Audifax & Abachum (the older Roman martyrs) over St Canute.
  #   * 21 Oct — St Hilarion, Abbot (the day's titular feast) over Ss Ursula & Companions.
  - { selector: dignior-simple, line: 24, ordinal: 24, subOrder: 0, cite: ordo-1954 }
  - { selector: simple, line: 24, ordinal: 24, subOrder: 1, cite: rg-da }
  - { selector: ordinary-feria, line: 27, ordinal: 27, subOrder: 0, cite: rg-da }
  # Below the table: a commemoration never celebrates (yields the day, is merely commemorated).
  - { selector: commemoration, line: 29, ordinal: 29, subOrder: 0, cite: rg-da }

# The named id-sets the tier derivation branches on. The temporal great feasts and Sundays
# are recognised by identity (they are minted by the temporal fillers, not carried in the
# sanctoral data), exactly as the 1962 table recognises its great feasts.
membership:
  # Easter, Pentecost, and Christmas — above the whole calendar (they are kind=sunday /
  # kind=feast yet must not fall into a Sunday or feast tier).
  - name: greatest
    cite: rg-da
    ids:
      - roman:temporale:christmas:nativity
      - roman:temporale:paschal:easter
      - roman:temporale:paschal:pentecost
  # First-class greater Sundays (Tit. IV §1): Advent I; Lent I-IV; Passion; Palm; Low.
  # (Easter and Pentecost are in `greatest`.)
  - name: first-class-sunday
    cite: rg-da
    ids:
      - roman:temporale:advent:sunday-1
      - roman:temporale:paschal:lent-1
      - roman:temporale:paschal:lent-2
      - roman:temporale:paschal:lent-3
      - roman:temporale:paschal:lent-4
      - roman:temporale:paschal:passion-sunday
      - roman:temporale:paschal:palm-sunday
      - roman:temporale:paschal:low-sunday
  # Second-class greater Sundays (Tit. IV §1): Advent II-IV; Septuagesima, Sexagesima,
  # Quinquagesima. Yield ONLY to a Double of the I class.
  - name: second-class-sunday
    cite: rg-da
    ids:
      - roman:temporale:advent:sunday-2
      - roman:temporale:advent:sunday-3
      - roman:temporale:advent:sunday-4
      - roman:temporale:paschal:septuagesima
      - roman:temporale:paschal:sexagesima
      - roman:temporale:paschal:quinquagesima
  # First-class (privileged) vigils with their own proper office: Christmas and Pentecost.
  # (The common sanctoral vigils are recognised by their `vigilia` grade, not here.)
  - name: privileged-vigil
    cite: rg-da
    ids:
      - roman:temporale:christmas:vigil
      - roman:temporale:paschal:pentecost-vigil
  # Feasts of the Lord that are themselves Doubles of the I class — they take a Sunday's
  # place up to and including a II-class Sunday (which yields to a Double I class). Mapped to
  # the double-i-class tier.
  - name: great-lord
    cite: rg-da
    ids:
      - roman:temporale:epiphany:domini
      - roman:temporale:christmas:octave-day
      - roman:temporale:paschal:ascension
      - roman:temporale:paschal:trinity-sunday
      - roman:temporale:paschal:corpus-christi
      - roman:temporale:paschal:sacred-heart
      - roman:temporale:month-computed:christ-the-king
  # Feasts of the Lord below the Double I class (an ordinary or greater double of the Lord)
  # that still take a LESSER Sunday's place — the Holy Name and the Holy Family. Mapped to
  # the feast-of-the-lord tier, above the lesser Sunday but below the II-class Sunday.
  - name: feasts-of-the-lord
    cite: rg-da
    ids:
      - roman:temporale:christmas:holy-name
      - roman:temporale:epiphany:holy-family
  # A moveable feast that is a greater double (Duplex maius) but of a saint / the BVM, not the Lord
  # — the Passiontide Seven Sorrows (#453). It is minted on the temporal path, so it carries no
  # legacy grade, and its 1962-mapped numeric rank (III) cannot tell a greater double from an
  # ordinary double (also III). Named here so tierOf routes it to the greater-double tier.
  - name: moveable-greater-double
    cite: ordo-1954
    ids:
      - roman:temporale:paschal:passion-week:septem-dolorum

  # The Simples of higher dignity (the two-simples tie-break, #453): named here so tierOf routes
  # them to the `dignior-simple` tier (subOrder 0), above a plain Simple (subOrder 1), so the more
  # worthy is celebrated and the other commemorated — instead of the resolver's arbitrary id-string
  # tie-break. These are the complete set of same-day Simple-vs-Simple collisions on the universal
  # 1954 calendar (both found by an offline scan of the fixed-date placements); a particular
  # calendar that adds its own Simples can extend the set through an overlay.
  #   * 19 January — Ss Marius, Martha, Audifax & Abachum (the older, first-listed Roman martyrs)
  #     over St Canute (a later addition); without this the id string wrongly prefers "canutus".
  #   * 21 October — St Hilarion, Abbot (the historic titular of the day) over Ss Ursula &
  #     Companions, Virgins & Martyrs (celebrated as the day's commemoration in the 1954 ordo).
  #     Here the id string happens to agree ("hilarion" < "ursula-et-socii"); listing it makes the
  #     result rule-driven, not luck.
  - name: dignior-simple
    cite: ordo-1954
    ids:
      - roman:sanctorale:hilarion
      - roman:sanctorale:marius-et-socii

# Commemorations admitted per day-type. The pre-1955 rite imposes no flat integer cap the
# way 1962 does (I=1/II=1/III=2/IV=2): multiple commemorations are normal and the practical
# bound is the odd-orations limit of the Missal (1, 3, 5, or 7 collects). We model that bound
# uniformly as three admitted commemorations, ordered privileged-first (privileged
# commemorations are made even on a Double I class — Tit. VII §1, the sharpest 1954-vs-1962
# contrast). Days that admit NONE (the Triduum, the privileged first-order octaves, Easter
# and Pentecost themselves) are handled in code, not by this limit. The fine per-day-type
# membership of the commemoration set is DEFERRED (rubric-system-model.md, Seam 6).
commemorationLimits:
  - { dayClass: 1, limit: 3, cite: rg-da }
  - { dayClass: 2, limit: 3, cite: rg-da }
  - { dayClass: 3, limit: 3, cite: rg-da }
  - { dayClass: 4, limit: 3, cite: rg-da }
