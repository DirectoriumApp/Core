# Cited sanctoral of the Novus Ordo (Ordinary Form) — the UNIVERSAL General Roman Calendar of
# the 2002 editio typica tertia, authored WHOLE for this edition (transformSanctoraleWhole, #108).
#
# THREE ENTRY SHAPES (docs/design/novus-ordo-calendar-model.md):
#   * A saint the reform KEEPS from the 1962 calendar is referenced BY ID ONLY — it carries its
#     Novus-Ordo grade (novusRank), colour, and date, and inherits its identity (kind, titulars, and
#     public-domain Latin name) from the shared cross-edition union (the base pass). Re-declaring its
#     identity would collide, and the copyrighted 2002 titles are never transcribed.
#   * A reform-ADDED observance declares its own identity (kind, titulars, names) and merges it into
#     the shared union. Its Latin title cites a public-domain text (mr-1920 / mart-rom-1922) where the
#     saint is ancient; a reform-coined descriptor or a modern saint's proper name — an uncopyrightable
#     identifier, not the Missal's literary text — cites the norming calendar (cal-rom-1969), the
#     sanctoral extension of the option-A rule already used for the temporal day-labels.
#   * A feast the reform RE-TITLED (e.g. the 2 Feb Presentation of the Lord, formerly the Purification)
#     takes a NEW id + identity, exactly like the re-titled Easter, since a differing name cannot reuse
#     a shared id.
#
# novusRank is the reformed grade (solemnity / feast / memorial / optional-memorial); the numeric
# RankClass is derived from it (transform.mjs deriveNovusRank) and both are carried. Every datum is
# cited: the grade/colour/date to the reformed General Roman Calendar (cal-rom-1969), a transcribed
# name to its public-domain or norming source. The dated calendar is cross-checked (run-and-compare)
# against romcal / LitCal / calapi and a human ordo in the validation slice (#260); no oracle is a
# data source. Generated from the verified authoring roster; edit the facts, not this file's shape.

