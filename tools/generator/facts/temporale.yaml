# Cited temporal ARCHETYPES — the per-office overlay the temporal fillers lay on
# the Easter/Advent skeleton. Each archetype is a stable structural bucket (an
# Advent Sunday, a Lenten Ember day, the Nativity …); the fillers compute WHICH
# archetype a given date is and its runtime parameters (the week ordinal, the
# weekday), then read the office's kind, rank, colour, and Latin name from here.
# Date arithmetic and the naming GRAMMAR (Roman numerals, the Feria/Sabbato
# prefix) stay in PHP; only these edition-varying FACTS are data.
#
# Fanned out by the generator into two schema'd shapes:
#   identity.temporale   (edition-invariant): archetype, kind, names.la template
#   attributes.temporale (per edition):       archetype, rank, colour
# joined by the archetype key, exactly as the sanctoral identity/attributes split.
#
# names.la is a Latin TEMPLATE. Placeholders the filler fills:
#   {ord}    a Roman numeral (the week / Sunday / octave-day ordinal)
#   {feria}  a leading Feria-N / Sabbato prefix; a "{feria} …" name is composed
#            by the engine's feriaLatin() from the phrase that follows.
# A template with neither placeholder is a fixed name.
#
# Season is NOT here: it is a structural feature of the block a day sits in
# (handled by the temporal skeleton's block->season table), so the fillers carry
# it, not this overlay. rank is the 1960 class (1 = highest); colour is a base
# colour, or `{ base: violet, roseAllowed: true }` for the rose-permitted Gaudete
# and Laetare Sundays.
#
# Every name is transcribed from the public-domain Missale Romanum (mr-1920);
# every rank and colour is a fact cited to the 1960 rubrics (rg-1960).

archetypes:
  # ---- Christmas cycle (Advent -> Epiphany) --------------------------------
