# The Priestly Fraternity of St Peter (FSSP) particular calendar, as a declarative
# overlay over the universal 1962 sanctoral (Core #76/#81). An overlay never changes
# engine code: it is a set of add/suppress/rerank operations on stable feast ids,
# layered onto the base sanctoral before precedence runs (docs/design/platform-urn-scheme.md
# — an overlay is NOT an edition; it adds/removes/reranks over one).
#
# The rank fact cites `fssp-ordo`, the Fraternity's own published calendar (a consult-only
# reference; a witness to the calendar, never transcribed). Because the feast already exists
# in the universal calendar with its Latin title cited to the public-domain Missale Romanum
# 1920, this overlay carries no new transcribed strings — it only re-ranks, so the born-cited
# gate is satisfied by the base identity row.
#
# SCOPE (v0.2): the FSSP's headline proper elevation, its titular patron. This is a
# deliberately NON-EXHAUSTIVE, well-attested subset — not the Fraternity's complete
# promulgated Proprium (that awaits a pinned FSSP ordo as an oracle, as SSPX has). What is
# NOT modelled here is documented rather than silently implied:
#   - Ss Peter & Paul (29 Jun) is a Confraternity indulgence day per the FSSP source but is
#     already first class universally, so it carries no overlay delta.
#   - The Fraternity's fuller sanctoral (any further proper feasts of its promulgated calendar)
#     is deferred until that calendar can be pinned; this overlay claims only what is cited.

id: directorium:overlay:roman:fssp
name: "Priestly Fraternity of St Peter"
rite: roman

operations:
  # The Chair of St Peter (22 Feb) — the Fraternity's titular patron — is elevated from a
  # second-class feast in the universal calendar to first class in FSSP apostolates.
  - op: rerank
    target: roman:sanctorale:cathedra-petri
    rank: 1
    cites:
      rank: fssp-ordo
